<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prabhat Vachan - Login</title>
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Full Screen Login Page Override */
        .login-page {
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.9)), url('../images/pattern.png') !important;
            background-size: cover !important;
            background-position: center !important;
            background-attachment: fixed !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            min-height: 100vh !important;
            width: 100vw !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        .login-page .container {
            max-width: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            width: 100% !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            min-height: 100vh !important;
        }
        
        .login-page .login-container {
            background-color: rgba(255, 255, 255, 0.97) !important;
            border-radius: 20px !important;
            padding: 60px 50px !important;
            width: 90% !important;
            max-width: 1200px !important;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4) !important;
            border: 2px solid var(--border-color) !important;
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 60px !important;
            align-items: center !important;
            min-height: 700px !important;
            margin: 20px !important;
        }
        
        .login-page .login-header {
            text-align: center !important;
            margin-bottom: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            height: 100% !important;
        }
        
        .login-page .logo {
            width: 180px !important;
            height: 180px !important;
            margin: 0 auto 30px !important;
            background: none !important;
            border: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            filter: drop-shadow(0 10px 12px rgba(72, 26, 10, 0.25)) !important;
        }
        
        .login-page .login-header h1.hindi-font {
            font-size: 3.5rem !important;
            color: var(--secondary-color) !important;
            margin-bottom: 15px !important;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1) !important;
        }
        
        .login-page .login-header h2 {
            font-size: 1.8rem !important;
            color: var(--primary-color) !important;
            margin-bottom: 40px !important;
            font-weight: 600 !important;
            letter-spacing: 1px !important;
        }
        
        .login-page .login-form {
            margin-bottom: 0 !important;
            width: 100% !important;
        }
        
        .login-page .login-form h3 {
            font-size: 2.2rem !important;
            color: var(--secondary-color) !important;
            margin-bottom: 35px !important;
            text-align: center !important;
            font-weight: 700 !important;
        }
        
        .login-page .form-group {
            margin-bottom: 30px !important;
        }
        
        .login-page .form-group label {
            font-size: 1.1rem !important;
            margin-bottom: 12px !important;
            color: var(--secondary-color) !important;
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
        }
        
        .login-page .form-group input {
            padding: 18px 20px !important;
            font-size: 1.1rem !important;
            border: 2px solid var(--border-color) !important;
            border-radius: 12px !important;
            transition: all 0.3s ease !important;
        }
        
        .login-page .form-group input:focus {
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 0 4px rgba(184, 134, 11, 0.2) !important;
            transform: translateY(-2px) !important;
        }
        
        .login-page .btn-login {
            padding: 18px !important;
            font-size: 1.2rem !important;
            border-radius: 12px !important;
            margin-top: 10px !important;
            margin-bottom: 25px !important;
            background: linear-gradient(to right, var(--secondary-color), var(--primary-color)) !important;
            transition: all 0.3s ease !important;
            font-weight: 700 !important;
            letter-spacing: 1px !important;
        }
        
        .login-page .btn-login:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 10px 20px rgba(139, 0, 0, 0.3) !important;
        }
        
        .login-page .login-options {
            margin-top: 25px !important;
            font-size: 1.05rem !important;
        }
        
        .login-page .login-options a {
            font-weight: 600 !important;
        }
        
        .login-page .social-login {
            margin-top: 40px !important;
            padding-top: 40px !important;
            border-top: 2px solid var(--border-color) !important;
        }
        
        .login-page .social-login p {
            font-size: 1.1rem !important;
            margin-bottom: 25px !important;
            color: var(--secondary-color) !important;
            font-weight: 600 !important;
        }
        
        .login-page .social-icons {
            gap: 25px !important;
        }
        
        .login-page .social-btn {
            width: 65px !important;
            height: 65px !important;
            font-size: 1.5rem !important;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1) !important;
            transition: all 0.3s ease !important;
        }
        
        .login-page .social-btn:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2) !important;
        }
        
        .login-page .cultural-quote {
            text-align: center !important;
            font-style: italic !important;
            margin-top: 0 !important;
            padding: 40px !important;
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.1), rgba(139, 0, 0, 0.1)) !important;
            border-radius: 15px !important;
            border-left: 5px solid var(--primary-color) !important;
            grid-column: 1 / -1 !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            height: 100% !important;
        }
        
        .login-page .cultural-quote p.hindi-font {
            font-size: 1.8rem !important;
            color: var(--secondary-color) !important;
            margin-bottom: 20px !important;
            line-height: 1.4 !important;
        }
        
        .login-page .cultural-quote p:not(.hindi-font) {
            font-size: 1.3rem !important;
            color: var(--primary-color) !important;
            font-weight: 600 !important;
        }
        
        /* Responsive adjustments for full screen */
        @media (max-width: 992px) {
            .login-page .login-container {
                grid-template-columns: 1fr !important;
                gap: 40px !important;
                min-height: auto !important;
                padding: 40px 30px !important;
            }
            
            .login-page .logo {
                width: 150px !important;
                height: 150px !important;
            }
            
            .login-page .login-header h1.hindi-font {
                font-size: 2.8rem !important;
            }
            
            .login-page .cultural-quote {
                margin-top: 20px !important;
            }
        }
        
        @media (max-width: 576px) {
            .login-page .login-container {
                width: 95% !important;
                padding: 30px 20px !important;
                margin: 10px !important;
            }
            
            .login-page .logo {
                width: 120px !important;
                height: 120px !important;
            }
            
            .login-page .login-header h1.hindi-font {
                font-size: 2.2rem !important;
            }
            
            .login-page .login-header h2 {
                font-size: 1.4rem !important;
            }
            
            .login-page .login-form h3 {
                font-size: 1.8rem !important;
            }
            
            .login-page .cultural-quote p.hindi-font {
                font-size: 1.4rem !important;
            }
            
            .login-page .cultural-quote p:not(.hindi-font) {
                font-size: 1.1rem !important;
            }
        }
    </style>
</head>
<body class="login-page">
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <img class="logo" src="images/logo.svg" alt="Prabhat Vachan sunrise and open book emblem">
                <h1 class="hindi-font">प्रभात वचन</h1>
                <h2>Cultural Literature Portal</h2>
            </div>
            
            <div class="login-form">
                <h3 id="authTitle">Welcome Back</h3>
                <form id="loginForm">
                    <div class="form-group" id="displayNameGroup" hidden>
                        <label for="displayName"><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="displayName" name="displayName" placeholder="Enter your name" autocomplete="name" minlength="2" maxlength="80">
                    </div>

                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="username" maxlength="254" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" maxlength="128" required>
                    </div>

                    <div class="form-group" id="confirmPasswordGroup" hidden>
                        <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" maxlength="128">
                    </div>
                    
                    <button type="submit" class="btn-login">Login</button>
                    
                    <div class="login-options">
                        <a href="#" class="forgot-link">Forgot Password?</a>
                        <p id="authPrompt">Don't have an account? <a href="#" id="signupLink">Sign Up</a></p>
                    </div>
                </form>
                
                <div class="social-login">
                    <p>Or login with</p>
                    <div class="social-icons">
                        <button class="social-btn google"><i class="fab fa-google"></i></button>
                        <button class="social-btn facebook"><i class="fab fa-facebook"></i></button>
                        <button class="social-btn twitter"><i class="fab fa-twitter"></i></button>
                    </div>
                </div>
            </div>
            
            <div class="cultural-quote">
                <p class="hindi-font">"पुस्तकें मन की खिड़कियाँ हैं, उन्हें खोलें और दुनिया देखें"</p>
                <p>"Books are windows to the soul, open them and see the world"</p>
            </div>
        </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
